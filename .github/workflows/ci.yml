name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  check-build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # js 后端要 Node 才能跑，先装好
      - name: 安装 Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: 安装 MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: MoonBit 版本
        run: moon version

      - name: 更新注册表索引
        run: moon update

      - name: 格式检查
        run: moon fmt --check

      - name: 检查
        run: moon check --target wasm-gc --deny-warn

      - name: 构建
        run: moon build --target wasm-gc

      - name: 测试（wasm-gc 后端）
        run: moon test --target wasm-gc

      # 解码逻辑不依赖后端特性，js 后端应解出同样的结果
      - name: 测试（js 后端）
        run: moon test --target js

      # ffmpeg 差分：本解码器与参考解码器逐样本比对（语料现场生成）
      - name: 安装 ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: 生成差分语料
        run: python3 tools/gen_corpus.py

      - name: 差分测试（wasm-gc）
        run: python3 tools/diff_oracle.py --target wasm-gc

      - name: 差分测试（js）
        run: python3 tools/diff_oracle.py --target js

      # 发布形态冒烟：加载 release wasm、走 base64 导出边界解码
      - name: WASM 导出冒烟
        run: |
          moon build --target wasm-gc --release
          node tools/wasm_smoke.mjs "$RUNNER_TEMP/out.wav"
